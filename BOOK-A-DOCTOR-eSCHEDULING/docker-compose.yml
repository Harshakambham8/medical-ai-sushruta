version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: book-a-doctor-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # ── Backend (Express / Node) ──────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: book-a-doctor-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/book-my-doctor
      JWT_SECRET: supersecuresecretkey123
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongo
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - app-network

  # ── Frontend (React / Vite preview) ──────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: book-a-doctor-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
