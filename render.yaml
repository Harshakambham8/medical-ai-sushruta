services:
  # ============================================================
  # 1. Medical AI Sushruta Express Backend (Web Service)
  # ============================================================
  - type: web
    name: medical-ai-sushruta-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ============================================================
  # 2. Medical AI Sushruta Vite React Frontend (Static Site)
  # ============================================================
  - type: web
    name: medical-ai-sushruta-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
